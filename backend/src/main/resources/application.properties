spring.application.name=carebridge-backend
server.port=8080

# Load optional untracked local overrides (DB credentials, JWT secret, Admin bootstrap)
spring.config.import=optional:classpath:application-local.properties

# Database (defaults use env vars; configure XAMPP/MySQL credentials in application-local.properties)
spring.datasource.url=${CAREBRIDGE_DB_URL:jdbc:mysql://localhost:3306/carebridge?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
spring.datasource.username=${CAREBRIDGE_DB_USERNAME:root}
spring.datasource.password=${CAREBRIDGE_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate (Flyway owns all schema changes)
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Security & JWT (MUST provide >= 32-byte secret via application-local.properties or env var)
carebridge.jwt.secret=${CAREBRIDGE_JWT_SECRET:}
carebridge.jwt.expiration-ms=${CAREBRIDGE_JWT_EXPIRATION_MS:86400000}

# Explicit CORS origin allowlist
carebridge.cors.allowed-origins=${CAREBRIDGE_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Protected Admin bootstrap (disabled by default; enable only in local/env config)
carebridge.admin.bootstrap.enabled=${CAREBRIDGE_ADMIN_BOOTSTRAP_ENABLED:false}
carebridge.admin.bootstrap.full-name=${CAREBRIDGE_ADMIN_NAME:CareBridge Admin}
carebridge.admin.bootstrap.mobile-number=${CAREBRIDGE_ADMIN_MOBILE:}
carebridge.admin.bootstrap.password=${CAREBRIDGE_ADMIN_PASSWORD:}
carebridge.admin.bootstrap.address=${CAREBRIDGE_ADMIN_ADDRESS:Dhaka, Bangladesh}

# Error response hygiene (never expose stack traces to clients)
server.error.include-stacktrace=never
server.error.include-message=never

# Secure local profile avatar uploads (max 2 MB, magic-byte verified)
carebridge.storage.avatar-dir=${CAREBRIDGE_AVATAR_DIR:uploads/avatars}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Background lifecycle & 7-day review lock schedulers
carebridge.scheduling.enabled=${CAREBRIDGE_SCHEDULING_ENABLED:true}
carebridge.scheduler.contract-lifecycle-ms=${CAREBRIDGE_CONTRACT_LIFECYCLE_MS:30000}
carebridge.scheduler.review-lock-ms=${CAREBRIDGE_REVIEW_LOCK_MS:900000}
